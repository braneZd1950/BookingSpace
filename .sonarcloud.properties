# SonarCloud Automatic Analysis reads THIS file (not sonar-project.properties).
sonar.projectKey=BookingSpace
sonar.projectName=BookingSpace

sonar.sources=server/src,client/src,shared
sonar.tests=server/test,client/e2e
sonar.test.inclusions=**/test/**/*.js,**/e2e/**/*.{js,ts}

sonar.exclusions=**/node_modules/**,**/dist/**,**/uploads/**,**/coverage/**,**/playwright-report/**,**/test-results/**,**/mock/**,**/email-previews/**,**/scripts/**

sonar.cpd.exclusions=**/test/**,**/e2e/**,**/scripts/**,**/email-previews/**,**/mock/**

sonar.sourceEncoding=UTF-8
