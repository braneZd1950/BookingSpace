# Blueprint for Render Opcija A (SPA + API on one service).
# Create/connect via Render Dashboard → New → Blueprint.
# Secrets must still be set in the Dashboard (MONGO_URI, JWT_SECRET, SMTP, …).

services:
  - type: web
    name: anyminutes
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm run build:render
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_CLIENT
        value: "true"
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: ADMIN_EMAIL_BOOTSTRAP
        value: "false"
      - key: VITE_APP_MODE
        value: production
      - key: PORT
        value: "4001"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: EXPORT_SEAL_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: VITE_API_URL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
