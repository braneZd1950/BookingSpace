name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    name: Server API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run API tests
        env:
          NODE_ENV: test
        run: npm run test:ci

  client-build:
    name: Client production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        env:
          VITE_API_URL: https://api.example.com/api
          VITE_APP_MODE: production
        run: npm run build

  client-e2e:
    name: Client Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci --ignore-scripts

      - name: Install server dependencies
        working-directory: server
        run: npm ci --ignore-scripts

      - name: Prefetch MongoDB binary
        working-directory: server
        run: npm run prefetch:mongo

      - name: Install Playwright Chromium
        working-directory: client
        run: npx playwright install chromium --with-deps

      - name: Run e2e
        working-directory: client
        env:
          CI: true
          VITE_API_URL: http://127.0.0.1:4001/api
          VITE_APP_MODE: production
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            client/playwright-report
            client/test-results
          retention-days: 7

  production-env-template:
    name: Production env template present
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Soft check (dev skip)
        run: node scripts/check-production-env.js

      - name: Guard rejects weak prod secrets
        run: |
          printf '%s\n' \
            'NODE_ENV=production' \
            'MONGO_URI=mongodb://example' \
            'JWT_SECRET=short' \
            'CLIENT_ORIGIN=http://localhost:5173' \
            'VITE_API_URL=http://localhost:4001/api' \
            > /tmp/bad.prod.env
          if node scripts/check-production-env.js --file /tmp/bad.prod.env --force; then
            echo "expected failure"
            exit 1
          fi
