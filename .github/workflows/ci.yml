name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    name: Server API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        env:
          NODE_ENV: test
        run: npm run test:ci

  client-build:
    name: Client production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_API_URL: https://api.example.com/api
          VITE_APP_MODE: production
        run: npm run build

  mobile-tests:
    name: Mobile Expo unit tests + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

  production-env-template:
    name: Production env template present
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Soft check (dev skip)
        run: node scripts/check-production-env.js

      - name: Guard rejects weak prod secrets
        run: |
          printf '%s\n' \
            'NODE_ENV=production' \
            'MONGO_URI=mongodb://example' \
            'JWT_SECRET=short' \
            'CLIENT_ORIGIN=http://localhost:5173' \
            'VITE_API_URL=http://localhost:4001/api' \
            > /tmp/bad.prod.env
          if node scripts/check-production-env.js --file /tmp/bad.prod.env --force; then
            echo "expected failure"
            exit 1
          fi
