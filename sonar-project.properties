sonar.projectKey=BookingSpace
sonar.projectName=BookingSpace

# Production sources only — tests are analyzed separately and excluded from CPD.
sonar.sources=server/src,client/src,shared,mobile/src,mobile/App.tsx,mobile/index.ts
sonar.tests=server/test,client/e2e,mobile/test
sonar.test.inclusions=**/test/**/*.js,**/e2e/**/*.{js,ts}

sonar.exclusions=**/node_modules/**,**/dist/**,**/uploads/**,**/coverage/**,**/playwright-report/**,**/test-results/**,**/mock/**,**/email-previews/**,**/scripts/**,**/mobile/.expo/**,**/mobile/docs/**,**/mobile/assets/**

# Duplication gate applies to production code; fixtures inflate CPD without product value.
# platformLegal = long GDPR prose with repeated section shape (not logic duplication)
sonar.cpd.exclusions=**/test/**,**/e2e/**,**/scripts/**,**/email-previews/**,**/mock/**,**/platformLegal/**

sonar.sourceEncoding=UTF-8
